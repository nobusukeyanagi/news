name: Update news

on:
  schedule:
    # UTC 15:04 / 23:04 / 07:04 = 日本時間 00:04 / 08:04 / 16:04
    - cron: '4 7,15,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      fresh: ${{ steps.build.outputs.fresh }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previously fetched news
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: site
          key: news-snapshot-${{ github.run_id }}
          restore-keys: |
            news-snapshot-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build page
        id: build
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f site/snapshot.json ]] &&
             python scripts/build.py --from-snapshot site/snapshot.json --output site; then
            echo '保存済みデータからページを再生成しました'
          else
            if [[ -f site/snapshot.json ]]; then
              cp site/snapshot.json "$RUNNER_TEMP/previous-news.json"
            fi
            rm -rf site
            python scripts/build.py --output site --previous-snapshot "$RUNNER_TEMP/previous-news.json"
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save snapshot after fetching news
        if: steps.build.outputs.fresh == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: site
          key: news-snapshot-${{ github.run_id }}
      - name: Pass NEW news to notification job
        if: steps.build.outputs.fresh == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: news-notification-snapshot
          path: site/snapshot.json
          if-no-files-found: error
          retention-days: 1
      - name: Package page
        run: tar --dereference --hard-dereference --exclude='./snapshot.json' -C site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v5
        if: needs.build.outputs.fresh == 'true'
      - name: Download NEW news data
        if: needs.build.outputs.fresh == 'true'
        uses: actions/download-artifact@v8
        with:
          name: news-notification-snapshot
          path: notification-data
      - name: Notify Discord after news update
        if: needs.build.outputs.fresh == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWS_URL: ${{ steps.deployment.outputs.page_url }}
          NEWS_SNAPSHOT_PATH: notification-data/snapshot.json
        run: python scripts/notify_discord.py
