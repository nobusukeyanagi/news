name: Update news

on:
  schedule:
    # UTC 18:00 / 06:00 = 日本時間 翌日03:00 / 同日15:00
    - cron: '0 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previously fetched news for a push
        if: github.event_name == 'push'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: site
          key: news-snapshot-${{ github.run_id }}
          restore-keys: |
            news-snapshot-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build page
        id: build
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && -f site/snapshot.json ]] &&
             python scripts/build.py --from-snapshot site/snapshot.json --output site; then
            echo '保存済みデータからページを再生成しました'
          else
            rm -rf site
            python scripts/build.py --output site
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save snapshot after fetching news
        if: steps.build.outputs.fresh == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: site
          key: news-snapshot-${{ github.run_id }}
      - name: Package page
        run: tar --dereference --hard-dereference --exclude='./snapshot.json' -C site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
